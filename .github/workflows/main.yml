name: Publish to Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Process
        env:
          A0D827: ${{ secrets.A0D827 }}
          B36E9F: ${{ secrets.B36E9F }}
        run: |
          python3 -c "
          import sys, pathlib, os
          meta_a = os.environ.get('A0D827', '')
          meta_b = os.environ.get('B36E9F', '')
          page = pathlib.Path('index.html')
          src = page.read_text(encoding='utf-8')
          out = src
          if meta_a:
              out = out.replace('<!-- 401d3f3abc325c74c78bfb3daacbbe127d88344c -->', meta_a)
          if meta_b:
              out = out.replace('<!-- 3fc83b34666d57d8a9225c7cdd43163ca9d6ab5959ad -->', meta_b)
          if out == src and (meta_a or meta_b):
              sys.exit(1)
          if out != src:
              page.write_text(out, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
